<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InmoVideo AI Studio Pro</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --accent-color: #2f81f7;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --border-color: #30363d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
    
    .header { text-align: center; margin-bottom: 20px; max-width: 800px; }
    .header h1 { font-size: 1.8rem; font-weight: 700; color: var(--text-main); }
    .header p { font-size: 0.95rem; color: var(--text-muted); margin-top: 6px; }

    .app-container {
      width: 100%;
      max-width: 1000px;
      height: 850px;
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>InmoVideo AI Studio</h1>
    <p>Generador de recorridos virtuales 3D desde fotografías para el sector inmobiliario</p>
  </div>

  <div class="app-container">
    <!-- Motor de IA procesado en la nube pública de alta estabilidad -->
    <iframe src="https://fffiloni-wan-2-1-image-to-video.hf.space" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
  </div>

</body>
</html>
